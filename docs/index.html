<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#081321">
    <title>Lila's First Light</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 25%, #17334a 0, #081321 45%, #030810 100%);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      #unity-container {
        position: relative;
        width: min(100vw, 56.25vh);
        height: min(177.7778vw, 100vh);
        max-width: 1080px;
        max-height: 1920px;
        overflow: hidden;
        background: #231F20;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #231F20;
        touch-action: none;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(62%, 320px);
        transform: translate(-50%, -50%);
        text-align: center;
        color: #f8edcf;
        letter-spacing: 0.16em;
        font-size: 13px;
      }
      #unity-logo {
        width: 82px;
        height: 82px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background:
          radial-gradient(circle, #fff7cf 0 14%, #ffd45f 15% 31%, #f29b32 32% 44%, transparent 45%),
          radial-gradient(circle, rgba(255, 217, 96, 0.55), transparent 68%);
        box-shadow: 0 0 38px rgba(255, 209, 87, 0.7);
      }
      #unity-progress-bar-empty {
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }
      #unity-progress-bar-full {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffcf5d, #fff2ae);
        box-shadow: 0 0 18px rgba(255, 209, 87, 0.75);
      }
      #unity-warning {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: none;
        z-index: 10;
        color: #15100a;
        font-size: 13px;
        line-height: 1.4;
      }
      #unity-warning > div {
        padding: 10px 12px;
        border-radius: 8px;
      }
      #unity-footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div>LIGHTING THE FOREST</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
    </div>
    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        const panel = document.createElement("div");
        panel.textContent = message;
        panel.style.background = type === "error" ? "#ff6f69" : "#ffe786";
        warningBanner.appendChild(panel);
        warningBanner.style.display = "block";
        if (type !== "error") {
          window.setTimeout(() => {
            panel.remove();
            if (!warningBanner.children.length) {
              warningBanner.style.display = "none";
            }
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/WebGL.loader.js";
      const config = {
        dataUrl: buildUrl + "/WebGL.data.br",
        frameworkUrl: buildUrl + "/WebGL.framework.js.br",
        codeUrl: buildUrl + "/WebGL.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ISYS3001 Student Project",
        productName: "Lila's First Light",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          window.unityInstance = unityInstance;
        }).catch((message) => {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
